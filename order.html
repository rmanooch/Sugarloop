<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order a Cake | Sugarloop Co</title>
  <meta name="description" content="Send Sugarloop Co an enquiry for a custom cake, cupcakes or baklava.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta property="og:image" content="images/logo.jpg">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo-wordmark.webp" alt="Sugarloop Co" width="900" height="204"></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="cakes.html">Menu</a></li>
        <li><a href="about.html">Our Story</a></li>
        <li><a class="nav-order" href="order.html" aria-current="page">Order</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Order a Cake</h1>
        <p>Tell us about your celebration and we&rsquo;ll get back to you with ideas and a quote. Prefer to chat? Message us on <a href="https://www.instagram.com/sugarloopco/" target="_blank" rel="noopener">Instagram</a>.</p>
      </div>
    </section>

    <section class="section section--flush">
      <div class="container form-wrap">
        <!-- Submissions are emailed to sugarloopcollc@gmail.com by FormSubmit (formsubmit.co).
             The very first submission sends an activation email to that inbox. -->
        <form class="form" action="https://formsubmit.co/sugarloopcollc@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="New cake enquiry from the Sugarloop Co website">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://rmanooch.github.io/Sugarloop/thanks.html">
          <input type="text" name="_honey" style="display: none" tabindex="-1" autocomplete="off">
          <label>Name
            <input type="text" name="name" required>
          </label>
          <label>Email
            <input type="email" name="email" required>
          </label>
          <label>Phone
            <input type="tel" name="phone">
          </label>
          <label>Date needed
            <input type="date" name="date" required>
          </label>
          <label>What would you like?
            <select name="cake">
              <option>Celebration cake</option>
              <option>Themed or character cake</option>
              <option>Cupcakes</option>
              <option>Baklava</option>
              <option>Wedding cake</option>
              <option>Something else</option>
            </select>
          </label>
          <label>Number of guests
            <input type="number" name="guests" min="1">
          </label>
          <label class="full">Tell us about your cake
            <textarea name="message" placeholder="Flavours, colours, theme, message on the cake, baklava quantities..."></textarea>
          </label>
          <button class="button full" type="submit">Send enquiry</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="footer-mark" href="index.html"><img src="images/logo-mark.webp" alt="Sugarloop Co" width="72" height="72" loading="lazy"></a>
      <ul class="footer-links">
        <li><a href="cakes.html">Menu</a></li>
        <li><a href="about.html">Our Story</a></li>
        <li><a href="order.html">Order</a></li>
        <li><a href="https://www.instagram.com/sugarloopco/" target="_blank" rel="noopener">Instagram</a></li>
      </ul>
      <p><a href="mailto:Sugarloopcollc@gmail.com">Sugarloopcollc@gmail.com</a></p>
      <p class="copyright">&copy; <span id="year"></span> Sugarloop Co</p>
    </div>
  </footer>

  <script src="js/main.js?v=3"></script>
</body>
</html>
